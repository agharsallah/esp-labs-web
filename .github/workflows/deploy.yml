# Deploys main to Cloudflare Workers when you run it (Actions → Deploy → Run workflow, or
# `gh workflow run Deploy`), instead of a local `pnpm deploy:prod`. The build runs here because the
# code reader bundles the esp-labs firmware checkout; Workers only receives the built assets.
# The production environment only accepts main, and the commit must be green.
#
# A successful deploy is then released: tagged vX.Y.Z (the next semver from the Conventional
# Commits since the last tag, tools/deploy/), with grouped release notes.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One production deploy at a time; a newer run replaces a queued one, a running one finishes.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The build fails without the firmware instead of shipping an empty code reader.
      REQUIRE_FIRMWARE: "1"
    steps:
      # Refuses a commit whose CI is still running or failed, so a red main never goes live.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" \
            --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI on $GITHUB_SHA is '${conclusion:-not finished}', not 'success'. Wait for it, or fix main."
            exit 1
          fi
      # The whole history and the tags, to find the last release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agharsallah/esp-labs
          path: esp-labs-firmware
          persist-credentials: false
      - name: Place the firmware beside the guide
        run: mv esp-labs-firmware ../esp-labs
      - uses: ./.github/actions/setup
      - name: Plan the release
        id: plan
        run: node tools/deploy/cli.ts plan | tee -a "$GITHUB_OUTPUT"
      - name: Build
        run: pnpm build
      # wrangler writes one JSON line per event; the "deploy" one lists the URLs the Worker is live on.
      - name: Deploy
        id: deploy
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          pnpm exec wrangler deploy --message "$TAG $GITHUB_SHA" --tag "$TAG"
          url="$(jq -rs '[.[] | select(.type == "deploy") | .targets[]?] | first // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          [ -n "$url" ] || { echo "::error::wrangler printed no deployment URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url ($TAG)" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Tag and release
    needs: deploy
    if: needs.deploy.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Write the release notes
        env:
          VERSION: ${{ needs.deploy.outputs.version }}
          URL: ${{ needs.deploy.outputs.url }}
        run: node tools/deploy/cli.ts notes "$VERSION" "$URL" > "$RUNNER_TEMP/notes.md"
      # Creates the tag on the deployed commit and marks this release as the latest.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.deploy.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "Released $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
