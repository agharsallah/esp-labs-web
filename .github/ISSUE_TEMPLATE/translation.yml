name: Translation
description: A wrong, awkward or missing translation, or a request for a new language.
title: "[Translation]: "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Small fixes are often quicker as a pull request: every translation lives in `src/locales/<language>/` (see [Translate](https://github.com/agharsallah/esp-labs-web/blob/main/CONTRIBUTING.md#translate)). Code, commands, pin names and what the board prints stay in English on purpose.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Français
        - Español
        - Italiano
        - Deutsch
        - 简体中文
        - 繁體中文
        - 日本語
        - العربية
        - English (the source text)
        - A new language (name it below)
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: The page where you saw it. Copy the address bar.
      placeholder: https://esp-labs-web.vercel.app/#/lessons/02?lang=de
  - type: textarea
    id: current
    attributes:
      label: What it says now
      description: Paste the text, or attach a screenshot.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
      description: Your suggestion, and why if it is not obvious (meaning, tone, a term makers use).
    validations:
      required: true
