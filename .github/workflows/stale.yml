# Nudges, then closes, issues and pull requests nobody has touched in a long while.
name: Stale

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 90
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,good first issue,help wanted
          exempt-pr-labels: pinned,security
          exempt-draft-pr: true
          stale-issue-message: >
            This issue has had no activity for 90 days. It will close in 14 days unless someone
            comments or removes the `stale` label.
          stale-pr-message: >
            This pull request has had no activity for 30 days. It will close in 14 days unless it
            is updated or someone comments.
          close-issue-reason: not_planned
          operations-per-run: 100
